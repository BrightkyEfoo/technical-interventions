map $uri $operations_port {
    default 8080;
    ~^/backend/kotlin/ 8081;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    location ~ ^/backend/(?<variant>java|kotlin)/(?<endpoint>api/v1/.*)$ {
        set $operations operations-$variant;
        proxy_pass http://$operations:$operations_port/$endpoint$is_args$args;
        proxy_set_header Host $http_host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /(sw\.js|offline-assets\.json|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
