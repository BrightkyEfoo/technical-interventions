spring.application.name=serviceops-notifications-java
server.port=8091
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.username=${RABBITMQ_USER:serviceops}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.max-retries=2
serviceops.events.variant=java
management.endpoints.web.exposure.include=health,metrics

management.metrics.distribution.percentiles-histogram.http.server.requests=true
