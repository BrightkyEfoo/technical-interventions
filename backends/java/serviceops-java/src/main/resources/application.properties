spring.application.name=serviceops-java
spring.profiles.default=postgres
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SERVICEOPS_ISSUER:http://localhost:8180/realms/serviceops}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SERVICEOPS_JWKS:http://localhost:8180/realms/serviceops/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=serviceops-api
#---
spring.config.activate.on-profile=!postgres
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

management.metrics.distribution.percentiles-histogram.http.server.requests=true
