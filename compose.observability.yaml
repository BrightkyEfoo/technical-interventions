x-management: &management
  MANAGEMENT_SERVER_PORT: "9091"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus

x-health: &management-health
  test:
    - CMD-SHELL
    - >-
      bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9091;
      printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
      grep -q "^HTTP/1.1 200" <&3'

services:
  operations-java:
    environment: *management
    healthcheck: *management-health
  operations-kotlin:
    environment: *management
    healthcheck: *management-health
  notifications-java:
    environment: *management
    healthcheck: *management-health
  notifications-kotlin:
    environment: *management
    healthcheck: *management-health
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Définis un mot de passe pour Grafana}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data:
